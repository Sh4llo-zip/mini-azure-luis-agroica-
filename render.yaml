services:
  - type: web
    name: mini-azure-luis-agroica
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn servidor_api_nlp:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
      - key: OPERADOR_USER
        value: operador_ica
      - key: OPERADOR_PASSWORD
        value: operador2026
      - key: SUPERVISOR_USER
        value: supervisor_ica
      - key: SUPERVISOR_PASSWORD
        value: supervisor2026
